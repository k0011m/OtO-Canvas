<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">OtOCanvas</title>
  <desc id="logo-description">近くに寄り添う黄色い丸と傾いた角丸三角形、ゆるやかに傾いた青緑の曲線</desc>
  <circle cx="325" cy="326" r="192" fill="#FFBE18"/>
  <!-- 正三角形の角を同じ半径で丸め、全体を回転させる。 -->
  <path d="M590 302
           A36 36 0 0 1 644 270.823
           L878 405.923
           A36 36 0 0 1 878 468.277
           L644 603.377
           A36 36 0 0 1 590 572.2
           Z"
        fill="#FF6958" transform="rotate(-8 700 437)"/>
  <!-- 曲線は均一な太さを保ち、全体の傾きで動きを付ける。 -->
  <path d="M193 657 C354 817 657 817 818 657"
        fill="none" stroke="#18B7B7" stroke-width="142" stroke-linecap="round"
        transform="rotate(5 505.5 717)"/>
</svg>
