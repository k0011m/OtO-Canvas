<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>管理キーのハッシュ作成</title>
<style>body{font-family:system-ui;max-width:720px;margin:48px auto;padding:20px;line-height:1.8}input,textarea,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;font:inherit}textarea{height:110px}button{cursor:pointer}</style>
<h1>管理キーのハッシュ作成</h1><p>このファイルは通信も保存もしません。パスワード管理ツールで作った32文字以上のランダムな管理キーを入力してください。人が考えた単語や短いパスワードには使わないでください。</p>
<label>管理キー<input id="key" type="password" autocomplete="off" minlength="32" maxlength="512"></label><button id="make">SHA-256ハッシュを作る</button><p id="status" role="status"></p><label>Cloudflareの SURVEY_ADMIN_KEY_HASH に保存する値<textarea id="hash" readonly></textarea></label><p>CloudflareのProductionでSecretとして上記の値を保存し、旧 SURVEY_ADMIN_KEY は削除してください。管理画面へのログインには、ハッシュではなく元の管理キーを使います。</p>
<script>
// 元のキーを通信・保存せず、Cloudflareへ登録する検証用ハッシュだけを表示する。
async function makeHash(){const input=document.getElementById('key');const out=document.getElementById('hash');out.value='';if(input.value.length<32||input.value.length>512){document.getElementById('status').textContent='32〜512文字のランダムなキーを入力してください。';return;}const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input.value));input.value='';out.value=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('status').textContent='ハッシュを作成しました。入力欄のキーは消去しました。';}
document.getElementById('make').addEventListener('click',makeHash);
</script></html>
